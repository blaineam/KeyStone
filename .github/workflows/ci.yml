name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: '15.4'

    - name: Build Package
      run: swift build -v

    - name: Run Tests
      run: swift test -v

  build-ios:
    name: Build (iOS)
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: '15.4'

    - name: Build for iOS Simulator
      run: |
        xcodebuild build \
          -scheme Keystone \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
          -skipPackagePluginValidation \
          | xcpretty --color

  lint:
    name: Swift Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2

    - name: Check Swift formatting
      run: |
        # Check for common issues (basic lint without external tools)
        echo "Checking for trailing whitespace..."
        # Exclude binary files (images, etc.) using -I flag
        ! grep -rIn " $" Sources/ Tests/ --include="*.swift" --include="*.tutorial" --include="*.plist" || (echo "Found trailing whitespace" && false)
        echo "Checking for TODO/FIXME comments..."
        grep -rn "TODO\|FIXME" Sources/ Tests/ --include="*.swift" || echo "No TODO/FIXME found"
        echo "Lint check passed!"
